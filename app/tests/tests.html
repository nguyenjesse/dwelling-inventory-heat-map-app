<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>POC3 Map — Tests</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; color: #1f2933; }
    h1 { font-size: 1.2rem; }
    .summary { font-weight: bold; padding: .6rem .8rem; border-radius: 6px; margin: 1rem 0; }
    .ok { background: #e6f4ea; color: #1b5e20; }
    .fail { background: #fdecea; color: #8a1c13; }
    ul { list-style: none; padding: 0; }
    li { padding: .25rem .5rem; border-bottom: 1px solid #eee; font-size: .88rem; }
    li.pass::before { content: "✓ "; color: #2e7d32; }
    li.fail::before { content: "✗ "; color: #d32f2f; }
    li.fail { color: #b71c1c; }
    .grp { margin-top: 1rem; font-weight: bold; color: #555; }
  </style>
</head>
<body>
  <h1>POC3 Dwelling Inventory Map — test suite</h1>
  <div id="summary" class="summary">Running…</div>
  <ul id="results"></ul>
  <script type="module" src="./tests.js"></script>
</body>
</html>
